<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scholarship Details</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="navbar-brand">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-primary"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
                Scholarship Finder
            </a>
            <div class="navbar-links">
                <a href="index.html">Home</a>
                <a href="profile.html">Find Scholarships</a>
                <a href="dashboard.html">Dashboard</a>
            </div>
        </div>
    </nav>

    <main class="container mt-8 mb-8" style="max-width: 800px;">
        <a href="javascript:history.back()" class="text-muted mb-4" style="display: inline-block;">&larr; Back to Results</a>
        
        <div id="detailsContainer" class="card">
            <div class="card-body text-center" style="padding: 4rem;">
                <p>Loading details...</p>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');
            const container = document.getElementById('detailsContainer');

            if (!id) {
                container.innerHTML = '<div class="card-body"><p>Scholarship not found.</p></div>';
                return;
            }

            try {
                const res = await fetch(`/api/scholarships/${id}`);
                const data = await res.json();

                if (data.error) {
                    container.innerHTML = `<div class="card-body"><p>${data.error}</p></div>`;
                    return;
                }

                container.innerHTML = `
                    <div class="card-body" style="padding: 2.5rem;">
                        <div class="flex justify-between items-start mb-6">
                            <div>
                                <span class="badge mb-2">${data.type}</span>
                                <h1 style="font-size: 2rem; margin-bottom: 0.5rem;">${data.name}</h1>
                                <p class="text-muted">ID: ${data.id}</p>
                            </div>
                            <div class="text-right">
                                <p class="text-muted" style="font-size: 0.9rem;">Amount</p>
                                <p class="text-primary font-bold" style="font-size: 2rem;">₹${data.amount.toLocaleString()}</p>
                            </div>
                        </div>

                        <div style="background: var(--bg-color); padding: 1.5rem; border-radius: 8px; margin-bottom: 2rem;">
                            <h3 class="mb-2">Description</h3>
                            <p>${data.description}</p>
                        </div>

                        <div class="grid grid-cols-2 mb-8">
                            <div>
                                <h3>Eligibility Criteria</h3>
                                <ul class="mt-4" style="list-style-type: disc; padding-left: 1.5rem; color: var(--text-muted);">
                                    ${data.minMarks ? `<li>Minimum Marks: ${data.minMarks}%</li>` : ''}
                                    ${data.incomeMax ? `<li>Family Income &le; ₹${data.incomeMax.toLocaleString()}</li>` : ''}
                                    ${data.level !== 'Any' ? `<li>Education Level: ${data.level}</li>` : ''}
                                    ${data.state !== 'Any' ? `<li>State/Region: ${data.state}</li>` : ''}
                                </ul>
                            </div>
                            <div>
                                <h3>Required Documents</h3>
                                <ul class="mt-4" style="list-style-type: disc; padding-left: 1.5rem; color: var(--text-muted);">
                                    ${(data.documents || []).map(doc => `<li>${doc}</li>`).join('')}
                                </ul>
                            </div>
                        </div>

                        <div class="flex justify-between items-center" style="border-top: 1px solid var(--border); padding-top: 2rem;">
                            <div>
                                <p class="text-muted text-sm">Application Deadline</p>
                                <p class="font-bold" style="color: #DC2626; font-size: 1.25rem;">
                                    ${new Date(data.deadline).toLocaleDateString()}
                                </p>
                            </div>
                            <div class="flex gap-4">
                                <button onclick="saveScholarship('${data.id}')" class="btn btn-outline">Save for Later</button>
                                <button class="btn btn-primary" onclick="alert('This is a prototype. In real app, this redirects to official portal.')">Apply Now</button>
                            </div>
                        </div>
                    </div>
                `;
            } catch (error) {
                container.innerHTML = '<div class="card-body"><p>Error loading details.</p></div>';
            }
        });

        async function saveScholarship(id) {
            const userId = localStorage.getItem('userId');
            if (!userId) {
                alert("Please complete your profile search first to get a session ID.");
                return;
            }
            try {
                const res = await fetch('/api/save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId, scholarshipId: id })
                });
                const data = await res.json();
                if (data.success) {
                    alert('Saved successfully!');
                }
            } catch (err) {
                alert("Failed to save.");
            }
        }
    </script>
</body>
</html>
