<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Matches - Scholarship Finder</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="navbar-brand">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-primary"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
                Scholarship Finder
            </a>
            <div class="navbar-links">
                <a href="index.html">Home</a>
                <a href="profile.html">Find Scholarships</a>
                <a href="dashboard.html">Dashboard</a>
            </div>
        </div>
    </nav>

    <main class="container mt-8 mb-8">
        <div class="flex justify-between items-center mb-8">
            <div>
                <h2>Your Matched Scholarships</h2>
                <p id="matchCount">Loading matches...</p>
            </div>
            <a href="profile.html" class="btn btn-outline">Edit Profile</a>
        </div>

        <div id="resultsGrid" class="grid grid-cols-2">
            <!-- Results will be injected here -->
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const matches = JSON.parse(localStorage.getItem('scholarshipMatches') || '[]');
            const grid = document.getElementById('resultsGrid');
            const count = document.getElementById('matchCount');

            if (matches.length === 0) {
                count.innerText = "We couldn't find exact matches. Try adjusting your profile.";
                grid.innerHTML = '<p class="text-muted">No scholarships available for current criteria.</p>';
                return;
            }

            count.innerText = `Great! We found ${matches.length} scholarships you qualify for.`;

            grid.innerHTML = matches.map(sch => `
                <div class="card flex flex-col justify-between" style="display: flex; flex-direction: column;">
                    <div class="card-body" style="flex: 1;">
                        <div class="flex justify-between items-start mb-4">
                            <h3 class="card-title" style="margin-bottom: 0;">${sch.name}</h3>
                            <span class="badge">₹${sch.amount.toLocaleString()}</span>
                        </div>
                        
                        <p class="text-muted mb-4" style="font-size: 0.95rem; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">
                            ${sch.description}
                        </p>
                        
                        <div style="background: #F9FAFB; padding: 1rem; border-radius: 8px; margin-bottom: 1rem; border: 1px solid var(--border);">
                            <p class="font-bold mb-2" style="font-size: 0.85rem; text-transform: uppercase; color: var(--text-muted);">Why you matched:</p>
                            ${(sch.matchReasons || []).map(r => `<div class="match-reason">${r}</div>`).join('')}
                        </div>
                        
                        <div class="flex gap-4 items-center text-sm mb-4">
                            <div class="flex items-center gap-2" style="color: #D97706;">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                                Deadline: <span class="font-bold">${new Date(sch.deadline).toLocaleDateString()}</span>
                            </div>
                        </div>
                    </div>
                    <div class="card-body" style="border-top: 1px solid var(--border); background: #fdfdfd; padding-top: 1rem; padding-bottom: 1rem;">
                        <div class="flex gap-2">
                            <button onclick="viewDetails('${sch.id}')" class="btn btn-primary" style="flex: 1;">View Details</button>
                            <button onclick="saveScholarship('${sch.id}')" class="btn btn-outline">Save</button>
                        </div>
                    </div>
                </div>
            `).join('');
        });

        function viewDetails(id) {
            window.location.href = `details.html?id=${id}`;
        }

        async function saveScholarship(id) {
            const userId = localStorage.getItem('userId');
            if (!userId) {
                alert("Please fill your profile first.");
                return;
            }
            try {
                const res = await fetch('/api/save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId, scholarshipId: id })
                });
                const data = await res.json();
                if (data.success) {
                    alert('Scholarship saved to your Dashboard!');
                }
            } catch (err) {
                console.error(err);
                alert("Failed to save scholarship.");
            }
        }
    </script>
</body>
</html>
