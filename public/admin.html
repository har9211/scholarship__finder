<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Scholarship Finder</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .admin-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }
        .admin-table th, .admin-table td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }
        .admin-table th {
            background: var(--bg-color);
            font-weight: 600;
        }
    </style>
</head>
<body>

    <nav class="navbar" style="background: #111827; color: white; border-bottom: none;">
        <div class="container">
            <a href="index.html" class="navbar-brand" style="color: white; -webkit-text-fill-color: white;">
                Admin Panel
            </a>
            <div class="navbar-links">
                <a href="index.html" style="color: #9CA3AF;">Exit to Site</a>
            </div>
        </div>
    </nav>

    <main class="container mt-8 mb-8">
        <!-- Login Section -->
        <div id="loginSection" class="card mx-auto mt-8" style="max-width: 400px; display: none;">
            <div class="card-body" style="background: #F9FAFB;">
                <h3 class="mb-4 text-center">Admin Login</h3>
                <form id="loginForm">
                    <div class="form-group">
                        <label class="form-label">Username</label>
                        <input type="text" id="loginUsername" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Password</label>
                        <input type="password" id="loginPassword" class="form-control" required>
                    </div>
                    <div id="loginError" class="text-red-500 mb-4" style="display: none; font-size: 0.875rem; color: #DC2626;">Invalid credentials</div>
                    <button type="submit" class="btn btn-primary" style="width: 100%;">Login</button>
                </form>
            </div>
        </div>

        <!-- Admin Panel -->
        <div id="adminPanel" style="display: none;">
            <div class="flex justify-between items-center mb-8">
                <h2>Manage Scholarships</h2>
                <div>
                    <button onclick="toggleForm()" class="btn btn-primary">+ Add Scholarship</button>
                    <button onclick="logout()" class="btn btn-outline" style="margin-left: 0.5rem; color: #DC2626; border-color: #DC2626;">Logout</button>
                </div>
            </div>

        <!-- Add Scholarship Form -->
        <div id="addForm" class="card mb-8" style="display: none;">
            <div class="card-body" style="background: #F9FAFB;">
                <h3 class="mb-4">Add New Scholarship</h3>
                <form id="scholarshipForm">
                    <div class="grid grid-cols-2">
                        <div class="form-group">
                            <label class="form-label">Scholarship Name</label>
                            <input type="text" id="name" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Amount (₹)</label>
                            <input type="number" id="amount" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Minimum Marks (%)</label>
                            <input type="number" id="minMarks" class="form-control">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Max Family Income (₹)</label>
                            <input type="number" id="incomeMax" class="form-control">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Education Level</label>
                            <select id="level" class="form-select">
                                <option value="Any">Any</option>
                                <option value="High School">High School</option>
                                <option value="Undergraduate">Undergraduate</option>
                                <option value="Postgraduate">Postgraduate</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Deadline</label>
                            <input type="date" id="deadline" class="form-control" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Description</label>
                        <textarea id="description" class="form-control" rows="3" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Save Scholarship</button>
                    <button type="button" onclick="toggleForm()" class="btn btn-outline" style="margin-left: 0.5rem;">Cancel</button>
                </form>
            </div>
        </div>

        <div class="card">
            <div style="overflow-x: auto;">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Amount</th>
                            <th>Level</th>
                            <th>Deadline</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr><td colspan="6" class="text-center">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
        </div> <!-- End of adminPanel -->
    </main>

    <script>
        function toggleForm() {
            const form = document.getElementById('addForm');
            form.style.display = form.style.display === 'none' ? 'block' : 'none';
        }

        async function loadScholarships() {
            const tbody = document.getElementById('tableBody');
            try {
                const res = await fetch('/api/scholarships');
                const data = await res.json();
                
                tbody.innerHTML = data.map(sch => `
                    <tr>
                        <td class="text-muted">${sch.id}</td>
                        <td class="font-bold">${sch.name}</td>
                        <td>₹${sch.amount.toLocaleString()}</td>
                        <td>${sch.level}</td>
                        <td>${new Date(sch.deadline).toLocaleDateString()}</td>
                        <td>
                            <button onclick="deleteScholarship('${sch.id}')" class="btn btn-outline" style="padding: 0.25rem 0.75rem; color: #DC2626; border-color: #DC2626;">Delete</button>
                        </td>
                    </tr>
                `).join('');
            } catch (error) {
                tbody.innerHTML = '<tr><td colspan="6" class="text-center text-red-500">Error loading data.</td></tr>';
            }
        }

        async function deleteScholarship(id) {
            if (!confirm('Are you sure you want to delete this scholarship?')) return;
            try {
                const res = await fetch(`/api/scholarships/${id}`, { 
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${localStorage.getItem('adminToken')}` }
                });
                
                if (res.status === 401 || res.status === 403) {
                    alert('Session expired. Please login again.');
                    logout();
                    return;
                }
                
                loadScholarships();
            } catch (error) {
                alert('Failed to delete.');
            }
        }

        document.getElementById('scholarshipForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const newSch = {
                name: document.getElementById('name').value,
                amount: parseInt(document.getElementById('amount').value),
                minMarks: document.getElementById('minMarks').value ? parseInt(document.getElementById('minMarks').value) : null,
                incomeMax: document.getElementById('incomeMax').value ? parseInt(document.getElementById('incomeMax').value) : null,
                level: document.getElementById('level').value,
                deadline: document.getElementById('deadline').value,
                description: document.getElementById('description').value,
                state: 'Any',
                category: 'Any',
                type: 'Admin Added'
            };

            try {
                const res = await fetch('/api/scholarships', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('adminToken')}`
                    },
                    body: JSON.stringify(newSch)
                });
                
                if (res.status === 401 || res.status === 403) {
                    alert('Session expired. Please login again.');
                    logout();
                    return;
                }
                
                if (res.ok) {
                    alert('Scholarship added!');
                    document.getElementById('scholarshipForm').reset();
                    toggleForm();
                    loadScholarships();
                }
            } catch (error) {
                alert('Error adding scholarship');
            }
        });

        // Authentication Logic
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                if (res.ok) {
                    const data = await res.json();
                    localStorage.setItem('adminToken', data.access_token);
                    document.getElementById('loginError').style.display = 'none';
                    checkAuth();
                } else {
                    document.getElementById('loginError').style.display = 'block';
                }
            } catch (err) {
                document.getElementById('loginError').style.display = 'block';
            }
        });

        function logout() {
            localStorage.removeItem('adminToken');
            checkAuth();
        }

        function checkAuth() {
            const token = localStorage.getItem('adminToken');
            if (token) {
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'block';
                loadScholarships();
            } else {
                document.getElementById('loginSection').style.display = 'block';
                document.getElementById('adminPanel').style.display = 'none';
            }
        }

        // Init
        document.addEventListener('DOMContentLoaded', checkAuth);
    </script>
</body>
</html>
