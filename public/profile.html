<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find My Scholarships - Scholarship Finder</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="navbar-brand">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-primary"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
                Scholarship Finder
            </a>
            <div class="navbar-links">
                <a href="index.html">Home</a>
                <a href="profile.html" class="active">Find Scholarships</a>
                <a href="dashboard.html">Dashboard</a>
            </div>
        </div>
    </nav>

    <main class="container mt-8 mb-8" style="max-width: 800px;">
        <div class="card">
            <div class="card-body">
                <h2 class="mb-2">Tell Us About Yourself</h2>
                <p class="mb-8">Fill in your details below to find the best scholarships matching your profile.</p>
                
                <form id="profileForm">
                    <div class="grid grid-cols-2">
                        <div class="form-group">
                            <label class="form-label">Full Name</label>
                            <input type="text" id="name" class="form-control" required placeholder="John Doe">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Age</label>
                            <input type="number" id="age" class="form-control" required placeholder="20">
                        </div>
                    </div>

                    <div class="grid grid-cols-2">
                        <div class="form-group">
                            <label class="form-label">State / Region</label>
                            <select id="state" class="form-select" required>
                                <option value="">Select State</option>
                                <option value="Urban">Urban</option>
                                <option value="Rural">Rural Area</option>
                                <option value="Delhi">Delhi</option>
                                <option value="Maharashtra">Maharashtra</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Annual Family Income (₹)</label>
                            <input type="number" id="income" class="form-control" required placeholder="300000">
                        </div>
                    </div>

                    <div class="grid grid-cols-2">
                        <div class="form-group">
                            <label class="form-label">Gender</label>
                            <select id="gender" class="form-select">
                                <option value="Any">Prefer not to say</option>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Category</label>
                            <select id="category" class="form-select">
                                <option value="General">General</option>
                                <option value="OBC">OBC</option>
                                <option value="SC/ST">SC/ST</option>
                                <option value="Minority">Minority</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-2">
                        <div class="form-group">
                            <label class="form-label">Education Level</label>
                            <select id="level" class="form-select" required>
                                <option value="High School">High School</option>
                                <option value="Undergraduate">Undergraduate</option>
                                <option value="Postgraduate">Postgraduate</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Percentage / GPA (%)</label>
                            <input type="number" id="marks" class="form-control" required placeholder="85">
                        </div>
                    </div>

                    <div class="form-group mt-4">
                        <button type="submit" class="btn btn-primary" style="width: 100%;">
                            Find My Scholarships
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script>
        document.getElementById('profileForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Gather form data
            const profile = {
                name: document.getElementById('name').value,
                age: parseInt(document.getElementById('age').value),
                state: document.getElementById('state').value,
                income: parseInt(document.getElementById('income').value),
                gender: document.getElementById('gender').value,
                category: document.getElementById('category').value,
                level: document.getElementById('level').value,
                marks: parseInt(document.getElementById('marks').value)
            };

            // Call API
            try {
                const response = await fetch('/api/match', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(profile)
                });
                const data = await response.json();
                
                // Store results in localStorage so results page can display them without a DB
                localStorage.setItem('scholarshipMatches', JSON.stringify(data.matches));
                localStorage.setItem('userId', data.userId);
                
                // Redirect to results
                window.location.href = 'results.html';
            } catch (error) {
                alert('Error matching scholarships. Please try again.');
                console.error(error);
            }
        });
    </script>
</body>
</html>
